<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C33;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  
  <!-- Decorative sound waves -->
  <g opacity="0.15">
    <circle cx="150" cy="200" r="80" fill="none" stroke="#FF6B00" stroke-width="1"/>
    <circle cx="150" cy="200" r="120" fill="none" stroke="#FF6B00" stroke-width="1"/>
    <circle cx="150" cy="200" r="160" fill="none" stroke="#FF6B00" stroke-width="1"/>
    <circle cx="1050" cy="200" r="80" fill="none" stroke="#FF6B00" stroke-width="1"/>
    <circle cx="1050" cy="200" r="120" fill="none" stroke="#FF6B00" stroke-width="1"/>
    <circle cx="1050" cy="200" r="160" fill="none" stroke="#FF6B00" stroke-width="1"/>
  </g>
  
  <!-- Menu bar mockup -->
  <rect x="350" y="80" width="500" height="28" rx="6" fill="#2a2a3e" opacity="0.9"/>
  
  <!-- Menu bar icon (Sonos-like) -->
  <g transform="translate(370, 86)">
    <rect width="16" height="16" rx="3" fill="url(#orangeGrad)" filter="url(#glow)"/>
    <circle cx="8" cy="8" r="3" fill="#1a1a2e"/>
    <path d="M 5 8 Q 8 5 11 8" fill="none" stroke="#1a1a2e" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 4 10 Q 8 6 12 10" fill="none" stroke="#1a1a2e" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  
  <!-- App name in menu bar -->
  <text x="395" y="99" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#ffffff" opacity="0.9">sonosBuddy</text>
  
  <!-- Menu bar items -->
  <text x="480" y="99" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#ffffff" opacity="0.5">Settings</text>
  <text x="545" y="99" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#ffffff" opacity="0.5">Favorites</text>
  <text x="620" y="99" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#ffffff" opacity="0.5">Groups</text>
  
  <!-- Main title -->
  <text x="600" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="56" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-1">sonosBuddy</text>
  
  <!-- Subtitle -->
  <text x="600" y="220" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" fill="#ffffff" opacity="0.7" text-anchor="middle">Minimalist Sonos Controller for macOS</text>
  
  <!-- Feature pills -->
  <g transform="translate(320, 260)">
    <rect width="100" height="32" rx="16" fill="#FF6B00" opacity="0.15"/>
    <text x="50" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#FF6B00" text-anchor="middle" font-weight="500">Menu Bar</text>
  </g>
  <g transform="translate(440, 260)">
    <rect width="100" height="32" rx="16" fill="#FF6B00" opacity="0.15"/>
    <text x="50" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#FF6B00" text-anchor="middle" font-weight="500">Voice Ctrl</text>
  </g>
  <g transform="translate(560, 260)">
    <rect width="100" height="32" rx="16" fill="#FF6B00" opacity="0.15"/>
    <text x="50" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#FF6B00" text-anchor="middle" font-weight="500">Multi-Room</text>
  </g>
  <g transform="translate(680, 260)">
    <rect width="100" height="32" rx="16" fill="#FF6B00" opacity="0.15"/>
    <text x="50" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#FF6B00" text-anchor="middle" font-weight="500">OAuth 2.1</text>
  </g>
  
  <!-- Bottom tagline -->
  <text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#ffffff" opacity="0.4" text-anchor="middle">Powered by Sonos 27mcp Protocol</text>
  
  <!-- Decorative dots -->
  <circle cx="280" cy="340" r="2" fill="#FF6B00" opacity="0.4"/>
  <circle cx="290" cy="340" r="2" fill="#FF6B00" opacity="0.6"/>
  <circle cx="300" cy="340" r="2" fill="#FF6B00" opacity="0.8"/>
  <circle cx="900" cy="340" r="2" fill="#FF6B00" opacity="0.8"/>
  <circle cx="910" cy="340" r="2" fill="#FF6B00" opacity="0.6"/>
  <circle cx="920" cy="340" r="2" fill="#FF6B00" opacity="0.4"/>
</svg>
